<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cozy Care • Daily Medicine Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #FAF4EE;
      --card-bg: #FFFFFF;
      --primary: #FFB7B2;
      --primary-dark: #E29587;
      --accent: #B5EAD7;
      --text-main: #5C524F;
      --text-muted: #8C827E;
      --border-color: #F0E6DF;
      --shadow: 0 10px 25px -5px rgba(226, 149, 135, 0.12), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; padding: 2rem 1rem; }
    
    .container { max-width: 600px; margin: 0 auto; filter: blur(8px); pointer-events: none; transition: filter 0.3s ease; }
    .container.unlocked { filter: none; pointer-events: auto; }

    /* Header Card */
    .header-card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 1.8rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow);
      position: relative;
      border: 2px solid var(--border-color);
    }
    
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .greeting { font-family: 'Fredoka', sans-serif; font-size: 1.6rem; color: #4A423F; }
    .sub-greeting { font-size: 0.95rem; color: var(--text-muted); margin-top: 2px; }
    
    .settings-btn {
      background: #FFF5F2;
      border: 1px solid var(--primary);
      color: var(--primary-dark);
      padding: 8px 14px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .settings-btn:hover { background: var(--primary); color: white; }

    /* Progress Card */
    .progress-box {
      background: #FFF9F6;
      border-radius: 16px;
      padding: 1rem;
      border: 1px dashed var(--primary);
      margin-top: 1rem;
    }
    .progress-text-flex { display: flex; justify-content: space-between; font-size: 0.9rem; font-weight: 700; margin-bottom: 6px; }
    .progress-bar-bg { background: #EFE8E2; height: 12px; border-radius: 6px; overflow: hidden; }
    .progress-bar-fill { background: linear-gradient(90deg, #FFC3A0, #FFA8A8); height: 100%; width: 0%; transition: width 0.4s ease; }

    /* Love Note Card */
    .love-note-box {
      background: linear-gradient(135deg, #E2F0CB, #B5EAD7);
      border-radius: 18px;
      padding: 1rem 1.2rem;
      margin-bottom: 1.5rem;
      color: #3B5D50;
      font-style: italic;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Tabs */
    .tabs { display: flex; gap: 8px; margin-bottom: 1.2rem; overflow-x: auto; padding-bottom: 4px; }
    .tab {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      color: var(--text-muted);
      transition: all 0.2s;
    }
    .tab.active { background: var(--primary); color: white; border-color: var(--primary); }

    /* Meds List */
    .meds-list { display: flex; flex-direction: column; gap: 12px; }
    
    .med-card {
      background: var(--card-bg);
      border-radius: 18px;
      padding: 1rem 1.2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 2px solid var(--border-color);
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.02);
    }
    .med-card.taken { background: #F6FAF7; border-color: #C7EAD8; opacity: 0.85; }
    
    .med-left { display: flex; align-items: center; gap: 14px; }
    
    .check-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid var(--primary);
      background: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 1rem;
      transition: all 0.2s ease;
    }
    .check-btn.checked { background: #71C99D; border-color: #71C99D; }

    .med-title { font-weight: 700; font-size: 1.05rem; color: #4A423F; }
    .med-sub { font-size: 0.85rem; color: var(--text-muted); }
    .med-note { font-size: 0.8rem; color: var(--primary-dark); margin-top: 2px; }

    .delete-btn { background: none; border: none; cursor: pointer; opacity: 0.4; font-size: 1.1rem; }
    .delete-btn:hover { opacity: 1; }

    /* Add Button */
    .add-med-btn {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 18px;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.1rem;
      cursor: pointer;
      margin-top: 1.2rem;
      box-shadow: 0 6px 15px rgba(255, 183, 178, 0.4);
      transition: transform 0.1s ease;
    }
    .add-med-btn:active { transform: scale(0.98); }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(250, 244, 238, 0.85);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1rem;
    }
    
    .modal {
      background: white;
      border-radius: 24px;
      padding: 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.12);
      border: 2px solid var(--border-color);
    }
    .modal h3 { font-family: 'Fredoka', sans-serif; font-size: 1.5rem; margin-bottom: 0.5rem; color: #4A423F; }
    
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 700; color: var(--text-muted); margin-bottom: 4px; }
    .form-group input, .form-group select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      outline: none;
      font-size: 1rem;
      background-color: #FAFAFA;
    }
    .modal-actions { display: flex; gap: 10px; margin-top: 1.5rem; }
    .btn-save { flex: 1; background: var(--primary); color: white; border: none; padding: 12px; border-radius: 12px; font-weight: 700; cursor: pointer; font-size: 1rem; }
    .btn-cancel { background: #EFE8E2; color: var(--text-main); border: none; padding: 12px 18px; border-radius: 12px; font-weight: 700; cursor: pointer; }
    
    .empty-state { text-align: center; padding: 2rem; color: var(--text-muted); }
    .error-msg { color: #E29587; font-size: 0.85rem; margin-top: 8px; display: none; font-weight: 700; }
  </style>
</head>
<body>

  <!-- Instant Entry Passcode Lock Modal -->
  <div class="modal-overlay" id="instant-lock-modal">
    <div class="modal" style="text-align: center;">
      <div style="font-size: 3rem; margin-bottom: 8px;">🔐</div>
      <h3>Welcome Back! 💕</h3>
      <p style="font-size: 0.95rem; color: var(--text-muted); margin-bottom: 1.5rem;">Enter your passcode to open your daily care tracker</p>
      <form id="instant-passcode-form">
        <div class="form-group">
          <input type="password" id="entry-passcode-input" placeholder="••••" style="text-align: center; font-size: 1.5rem; letter-spacing: 6px;" maxlength="10" autofocus required>
          <div class="error-msg" id="entry-passcode-error">Incorrect passcode, try again! 🌸</div>
        </div>
        <button type="submit" class="btn-save" style="width: 100%;">Unlock App ✨</button>
      </form>
    </div>
  </div>

  <div class="container" id="main-container">
    
    <!-- Header -->
    <div class="header-card">
      <div class="top-bar">
        <div>
          <div class="greeting">Hi, <span id="gf-name">Sweetheart</span> 🌸</div>
          <div class="sub-greeting">Here is your daily care tracker</div>
        </div>
        <button class="settings-btn" onclick="openSettingsModal()">⚙️ Settings</button>
      </div>

      <!-- Progress -->
      <div class="progress-box">
        <div class="progress-text-flex">
          <span id="status-message">Loading progress...</span>
          <span id="progress-text">0/0</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progress-bar"></div>
        </div>
      </div>
    </div>

    <!-- Personal Love Note -->
    <div class="love-note-box">
      <span style="font-size: 1.3rem;">💌</span>
      <span id="display-love-note">"Remember to take care of yourself, I love you!"</span>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" onclick="filterMeds('all', event)">All Daily</button>
      <button class="tab" onclick="filterMeds('morning', event)">🌅 Morning</button>
      <button class="tab" onclick="filterMeds('afternoon', event)">☀️ Afternoon</button>
      <button class="tab" onclick="filterMeds('evening', event)">🌙 Evening</button>
      <button class="tab" onclick="filterMeds('bedtime', event)">💤 Bedtime</button>
    </div>

    <!-- Medicines List -->
    <div class="meds-list" id="meds-list"></div>

    <button class="add-med-btn" onclick="openAddModal()">+ Add New Reminder</button>
  </div>

  <!-- Add Medicine Modal -->
  <div class="modal-overlay" id="add-modal" style="display: none;">
    <div class="modal">
      <h3>Add New Medicine 💊</h3>
      <form id="add-med-form">
        <div class="form-group">
          <label>Medicine Name</label>
          <input type="text" id="med-name" placeholder="e.g., Vitamin C" required>
        </div>
        <div class="form-group">
          <label>Dosage</label>
          <input type="text" id="med-dosage" placeholder="e.g., 1 tablet" required>
        </div>
        <div class="form-group">
          <label>Time Category</label>
          <select id="med-category">
            <option value="morning">Morning 🌅</option>
            <option value="afternoon">Afternoon ☀️</option>
            <option value="evening">Evening 🌙</option>
            <option value="bedtime">Bedtime 💤</option>
          </select>
        </div>
        <div class="form-group">
          <label>Scheduled Time Text</label>
          <input type="text" id="med-time" placeholder="e.g., 8:00 AM" required>
        </div>
        <div class="form-group">
          <label>Choose Icon Emoji</label>
          <select id="med-icon">
            <option value="💊">💊 Pill / Medicine</option>
            <option value="🌸">🌸 Flower</option>
            <option value="💧">💧 Water / Hydration</option>
            <option value="🌙">🌙 Moon / Bedtime</option>
            <option value="☀️">☀️ Sun / Morning</option>
            <option value="🍯">🍯 Honey / Syrup</option>
            <option value="🍵">🍵 Warm Tea</option>
            <option value="🍓">🍓 Berry / Vitamin</option>
            <option value="🍎">🍎 Apple / Health</option>
            <option value="🧸">🧸 Teddy Bear</option>
            <option value="💗">💗 Pink Heart</option>
            <option value="💜">💜 Purple Heart</option>
          </select>
        </div>
        <div class="form-group">
          <label>Cozy Note / Tip (Optional)</label>
          <input type="text" id="med-note" placeholder="e.g., Take after food with water">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn-save">Save Medicine</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="settings-modal" style="display: none;">
    <div class="modal">
      <h3>Personalize For Her 💕</h3>
      <div class="form-group">
        <label>Her Name / Nickname</label>
        <input type="text" id="gf-name-input" placeholder="e.g. Sweetheart">
      </div>
      <div class="form-group">
        <label>Personal Love Note</label>
        <textarea id="love-note-input" rows="3" style="width:100%; padding:10px; border-radius:12px; border:1px solid var(--border-color); outline:none; background-color:#FAFAFA;" placeholder="Write a cute reminder message here..."></textarea>
      </div>
      <div class="form-group">
        <label>Change Passcode</label>
        <input type="text" id="passcode-edit-input" placeholder="Enter new passcode">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-cancel" onclick="closeSettingsModal()">Cancel</button>
        <button type="button" class="btn-save" onclick="saveSettings()">Save Changes</button>
      </div>
    </div>
  </div>

  <script>
    let medicines = [];
    let currentFilter = 'all';

    // Instant Passcode Unlock Handler
    document.getElementById('instant-passcode-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const passcode = document.getElementById('entry-passcode-input').value;

      try {
        const res = await fetch('/api/settings/verify-passcode', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ passcode })
        });
        const data = await res.json();

        if (data.success) {
          document.getElementById('instant-lock-modal').style.display = 'none';
          document.getElementById('main-container').classList.add('unlocked');
          loadData(); // Load contents after unlocked!
        } else {
          document.getElementById('entry-passcode-error').style.display = 'block';
        }
      } catch (err) {
        alert("Error verifying passcode.");
      }
    });

    // Load data from Flask
    async function loadData() {
      try {
        const settingsRes = await fetch('/api/settings');
        const settings = await settingsRes.json();
        document.getElementById('gf-name').textContent = settings.nickname || 'Sweetheart';
        document.getElementById('gf-name-input').value = settings.nickname || 'Sweetheart';
        document.getElementById('love-note-input').value = settings.love_note || '';
        document.getElementById('passcode-edit-input').value = settings.passcode || '1234';
        document.getElementById('display-love-note').textContent = `"${settings.love_note}"`;

        const medRes = await fetch('/api/medicines');
        medicines = await medRes.json();
        
        renderMeds();
        updateProgress();
      } catch (err) {
        console.error("Error loading data:", err);
      }
    }

    // Render Medicine Cards
    function renderMeds() {
      const list = document.getElementById('meds-list');
      list.innerHTML = '';

      const filtered = currentFilter === 'all' 
        ? medicines 
        : medicines.filter(m => m.time_category === currentFilter);

      if (filtered.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <div style="font-size: 2.5rem; margin-bottom: 8px;">🌸</div>
            <p>No medicines scheduled for this time slot!</p>
          </div>`;
        return;
      }

      filtered.forEach(med => {
        const card = document.createElement('div');
        card.className = `med-card ${med.taken_today ? 'taken' : ''}`;
        card.innerHTML = `
          <div class="med-left">
            <button class="check-btn ${med.taken_today ? 'checked' : ''}" onclick="toggleMed(${med.id}, event)">
              ${med.taken_today ? '✓' : ''}
            </button>
            <div>
              <div class="med-title">${med.icon} ${med.name}</div>
              <div class="med-sub">${med.dosage} • ${med.time_str}</div>
              ${med.note ? `<div class="med-note">💡 ${med.note}</div>` : ''}
            </div>
          </div>
          <button class="delete-btn" onclick="deleteMed(${med.id})" title="Delete">🗑️</button>
        `;
        list.appendChild(card);
      });
    }

    // Toggle Medicine Status
    async function toggleMed(id, event) {
      try {
        const res = await fetch(`/api/medicines/${id}/toggle`, { method: 'POST' });
        const data = await res.json();
        
        const med = medicines.find(m => m.id === id);
        if (med) {
          med.taken_today = data.taken_today;
          if (med.taken_today) {
            triggerHearts(event.clientX, event.clientY);
            playChime();
          }
        }
        
        renderMeds();
        updateProgress();
      } catch (err) {
        alert("Could not connect to server!");
      }
    }

    // Filter Tabs
    function filterMeds(category, event) {
      currentFilter = category;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      if (event && event.target) {
        event.target.classList.add('active');
      }
      renderMeds();
    }

    // Update Progress Bar
    function updateProgress() {
      const total = medicines.length;
      const x = medicines.filter(m => m.taken_today).length;
      const percent = total === 0 ? 0 : Math.round((x / total) * 100);

      document.getElementById('progress-text').textContent = `${x}/${total}`;
      document.getElementById('progress-bar').style.width = `${percent}%`;

      const statusMsg = document.getElementById('status-message');
      if (total === 0) statusMsg.textContent = "Add your daily routine to get started!";
      else if (percent === 100) statusMsg.textContent = "🎉 All done for today! You're amazing!";
      else if (percent > 0) statusMsg.textContent = "Great job! Keep taking care of yourself 💕";
      else statusMsg.textContent = "Ready whenever you are! You've got this 🌸";
    }

    // Modals
    function openAddModal() { document.getElementById('add-modal').style.display = 'flex'; }
    function closeModal() { document.getElementById('add-modal').style.display = 'none'; }

    document.getElementById('add-med-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newMed = {
        name: document.getElementById('med-name').value,
        dosage: document.getElementById('med-dosage').value,
        time_category: document.getElementById('med-category').value,
        time_str: document.getElementById('med-time').value,
        icon: document.getElementById('med-icon').value,
        note: document.getElementById('med-note').value
      };

      try {
        await fetch('/api/medicines', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(newMed)
        });
        
        closeModal();
        e.target.reset();
        loadData();
      } catch (err) {
        alert("Error saving medicine!");
      }
    });

    async function deleteMed(id) {
      if (!confirm("Remove this medicine reminder?")) return;
      try {
        await fetch(`/api/medicines/${id}`, { method: 'DELETE' });
        loadData();
      } catch (err) {
        alert("Error deleting medicine!");
      }
    }

    function openSettingsModal() { document.getElementById('settings-modal').style.display = 'flex'; }
    function closeSettingsModal() { document.getElementById('settings-modal').style.display = 'none'; }

    async function saveSettings() {
      const nickname = document.getElementById('gf-name-input').value;
      const love_note = document.getElementById('love-note-input').value;
      const passcode = document.getElementById('passcode-edit-input').value;

      try {
        await fetch('/api/settings', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nickname, love_note, passcode })
        });
        
        closeSettingsModal();
        loadData();
        alert("Settings updated successfully! 💕");
      } catch (err) {
        alert("Error saving settings!");
      }
    }

    // Audio Chime
    function playChime() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.08, ctx.currentTime + i * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.08 + 0.25);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + i * 0.08);
          osc.stop(ctx.currentTime + i * 0.08 + 0.25);
        });
      } catch(e) {}
    }

    // Hearts Effect
    function triggerHearts(x, y) {
      for (let i = 0; i < 10; i++) {
        const heart = document.createElement('div');
        heart.textContent = ['🌸', '💕', '✨', '💖'][Math.floor(Math.random() * 4)];
        heart.style.position = 'fixed';
        heart.style.left = `${x}px`;
        heart.style.top = `${y}px`;
        heart.style.pointerEvents = 'none';
        heart.style.fontSize = '1.2rem';
        heart.style.zIndex = '9999';
        
        const angle = Math.random() * Math.PI * 2;
        const velocity = 30 + Math.random() * 50;
        const destX = Math.cos(angle) * velocity;
        const destY = Math.sin(angle) * velocity - 30;

        heart.animate([
          { transform: 'translate(0, 0) scale(1)', opacity: 1 },
          { transform: `translate(${destX}px, ${destY}px) scale(0.3)`, opacity: 0 }
        ], {
          duration: 700 + Math.random() * 300,
          easing: 'cubic-bezier(0, .9, .57, 1)'
        }).onfinish = () => heart.remove();

        document.body.appendChild(heart);
      }
    }
  </script>
</body>
</html>
